name: jolly-rogue

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Depuis PostgreSQL 18, PGDATA = /var/lib/postgresql/18/docker :
      # le volume se monte sur le parent (/var/lib/postgresql), plus sur .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:6
    restart: unless-stopped
    # La commande par défaut écoute sur [::] et plante si le réseau Docker n'a pas d'IPv6
    # (cas par défaut des réseaux bridge) : on force l'écoute IPv4.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    build:
      context: .
      dockerfile: packages/data-pipeline/Dockerfile
    profiles: [tools]
    # Même uid/gid que le propriétaire de ./data sur l'hôte, sinon cache et exports ne sont pas inscriptibles.
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_DIR: /data
      PIPELINE_USER_AGENT: ${PIPELINE_USER_AGENT:-}
    volumes:
      - ./data/cache:/data/cache
      - ./data/exports:/data/exports
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
