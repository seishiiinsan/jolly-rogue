# Catalogue fermé : un déclencheur + une liste d'effets paramétrés (docs/regles-j1.md §3).
# Déclencheurs : combat_start, every_n_actions (n), on_kill, on_death.
# Effets : damage (pct de l'ATK), heal (pct de l'ATK), shield (pct des PV max du lanceur),
#          stun (turns), buff_atk (pct). Cibles : self, target, target_row, all_enemies,
#          random_enemy, lowest_hp_ally, all_allies.

# --- Persos ---
